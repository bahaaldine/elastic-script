# Moltler Documentation
# The AI Skills Creation Framework for Elasticsearch
# https://bahaaldine.github.io/moltler/

site_name: Moltler
site_description: The AI Skills Creation Framework for Elasticsearch
site_author: Bahaaldine Azarmi
site_url: https://bahaaldine.github.io/moltler/

repo_name: bahaaldine/moltler
repo_url: https://github.com/bahaaldine/moltler
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  font:
    text: Inter
    code: JetBrains Mono
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  
  icon:
    logo: material/creation
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: bahaaldine
      repo: elastic-script
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation - Solutions first, progressive disclosure
nav:
  - Home: index.md
  
  # LEVEL 1: Solutions (what users care about)
  - Solutions:
    - Observability: solutions/observability.md
    - Security: solutions/security.md
    - Search: solutions/search.md
  
  # LEVEL 2: Get started
  - Get Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - Your First Skill: getting-started/first-skill.md
  
  # LEVEL 3: Browse and use skills
  - Skills:
    - Browse Skills: moltlerhub/index.md
    - Using Skills: skills/overview.md
    - Skill Packs: skills/skill-packs.md
  
  # LEVEL 4: Build your own
  - Build Skills:
    - Creating Skills: skills/creating-skills.md
    - Parameters: skills/parameters.md
    - Testing: skills/testing.md
    - Publishing: skills/publishing.md
    - Contributing: moltlerhub/contributing.md
  
  # LEVEL 5: AI Integration
  - AI Integration:
    - MCP for AI Agents: mcp.md
    - Generate Skills: ai/generate-skills.md
    - Agents: agents/overview.md
  
  # LEVEL 6: Advanced (hidden complexity)
  - Advanced:
    - Connectors:
      - Overview: connectors/overview.md
      - GitHub: connectors/github.md
      - Jira: connectors/jira.md
      - Slack: connectors/slack.md
      - PagerDuty: connectors/pagerduty.md
      - Building Connectors: connectors/building-connectors.md
    - Agents:
      - Creating Agents: agents/creating-agents.md
      - Execution Model: agents/execution-model.md
      - Human-in-the-Loop: agents/human-in-the-loop.md
      - Monitoring: agents/monitoring.md
    - Language Reference:
      - Overview: language/overview.md
      - Variables & Types: language/variables-types.md
      - Control Flow: language/control-flow.md
      - Procedures: language/procedures.md
      - Functions: language/functions.md
      - Error Handling: language/error-handling.md
      - Async Execution: language/async-execution.md
    - Function Reference:
      - Overview: functions/overview.md
      - String: functions/string.md
      - Number: functions/number.md
      - Array: functions/array.md
      - Date: functions/date.md
      - Document: functions/document.md
      - Elasticsearch: functions/elasticsearch.md
      - AI & LLM: functions/ai-llm.md
  
  # Examples
  - Examples:
    - Observability: examples/observability-skills.md
    - Incident Response: examples/incident-response.md
    - DevOps Automation: examples/devops-automation.md
  
  # For contributors
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Roadmap: roadmap.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bahaaldine/elastic-script
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/bfrancenot
  
  generator: false
  
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

