name: upgrade_fleet_agent
version: 1.0.0
description: Upgrade a Fleet agent to a specific version
author: elastic
category: kibana
tags:
  - kibana
  - fleet
  - agents
  - upgrade
parameters:
  - name: agent_id
    type: STRING
    description: The ID of the agent to upgrade
    required: true
  - name: version
    type: STRING
    description: Target version (e.g., 8.12.0)
    required: true
returns: DOCUMENT
