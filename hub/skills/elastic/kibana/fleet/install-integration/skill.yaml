name: install_integration
version: 1.0.0
description: Install a Fleet integration package
author: elastic
category: kibana
tags:
  - kibana
  - fleet
  - integrations
  - install
parameters:
  - name: package_name
    type: STRING
    description: Name of the integration package (e.g., nginx, aws)
    required: true
  - name: version
    type: STRING
    description: Version to install (optional, latest if not specified)
    required: false
returns: DOCUMENT
