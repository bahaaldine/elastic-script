name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Debug - Show structure
        run: |
          echo "=== Repository structure ==="
          ls -la
          echo ""
          echo "=== elastic-script plugin source ==="
          ls -la elastic-script/
          echo ""
          echo "=== elasticsearch submodule ==="
          ls -la elasticsearch/ | head -10
          echo ""
          echo "=== x-pack/plugin directory ==="
          ls -la elasticsearch/x-pack/plugin/ | head -20
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      
      - name: Setup plugin in ES tree
        run: |
          # Check if symlink exists and remove it
          if [ -L "elasticsearch/x-pack/plugin/elastic-script" ]; then
            echo "Removing existing symlink"
            rm elasticsearch/x-pack/plugin/elastic-script
          elif [ -d "elasticsearch/x-pack/plugin/elastic-script" ]; then
            echo "Removing existing directory"
            rm -rf elasticsearch/x-pack/plugin/elastic-script
          fi
          
          # Copy the plugin source into the ES tree
          cp -r elastic-script elasticsearch/x-pack/plugin/elastic-script
          
          echo "=== Plugin directory after setup ==="
          ls -la elasticsearch/x-pack/plugin/elastic-script/
      
      - name: Build Plugin
        working-directory: elasticsearch
        run: |
          echo "=== Starting build ==="
          # Use bundlePlugin task which creates the distributable zip
          ./gradlew :x-pack:plugin:elastic-script:bundlePlugin -x test --no-daemon 2>&1 | tail -50
      
      - name: Find and prepare artifacts
        id: artifacts
        run: |
          echo "=== Looking for build artifacts ==="
          find elasticsearch -name "*.zip" -path "*elastic-script*" 2>/dev/null
          
          mkdir -p dist
          
          # Find the zip file
          ZIP_FILE=$(find elasticsearch/x-pack/plugin/elastic-script/build/distributions -name "*.zip" 2>/dev/null | head -1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found: $ZIP_FILE"
            # Get version from the zip filename
            FILENAME=$(basename "$ZIP_FILE")
            cp "$ZIP_FILE" "dist/$FILENAME"
            echo "artifact_name=$FILENAME" >> $GITHUB_OUTPUT
            echo "Artifact ready: dist/$FILENAME"
          else
            echo "ERROR: No zip file found!"
            echo "=== Checking build directory ==="
            ls -la elasticsearch/x-pack/plugin/elastic-script/build/ 2>/dev/null || echo "No build dir"
            ls -la elasticsearch/x-pack/plugin/elastic-script/build/distributions/ 2>/dev/null || echo "No distributions dir"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elastic-script-plugin
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: elastic-script-plugin
          path: dist
      
      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Moltler Plugin Release
            
            Download the plugin zip and install it on your Elasticsearch cluster.
            
            > **Note:** This plugin is built against Elasticsearch 9.x (main branch).
            > For other versions, you may need to build from source.
            
            ### Installation
            
            ```bash
            # Download the plugin
            wget https://github.com/bahaaldine/moltler/releases/download/${{ github.ref_name }}/x-pack-escript-<VERSION>.zip
            
            # Install the plugin on each node
            elasticsearch-plugin install file:///path/to/x-pack-escript-<VERSION>.zip
            
            # Restart Elasticsearch
            systemctl restart elasticsearch
            ```
            
            ### Install Skills
            
            After installing the plugin, install the skills:
            
            ```bash
            git clone https://github.com/bahaaldine/moltler.git
            cd moltler/hub
            ./moltler-cli.sh install --all
            ```
            
            ### Build for Other ES Versions
            
            If you need a different Elasticsearch version:
            
            ```bash
            git clone --recurse-submodules https://github.com/bahaaldine/moltler.git
            cd moltler/elastic-script/elasticsearch
            
            # Checkout your ES version
            git checkout v8.x.x
            
            # Build
            ./gradlew :x-pack:plugin:elastic-script:build -x test
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
