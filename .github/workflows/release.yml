name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      es_versions:
        description: 'ES versions to build (comma-separated)'
        required: false
        default: '8.17.0,9.0.0'

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  # STEP 1: Validate all skills before build
  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.validate.outputs.total }}
      valid: ${{ steps.validate.outputs.valid }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Validate all skills
        id: validate
        run: |
          echo "=== Validating Skills ==="
          
          # Validate elastic skills
          python tests/skills/validate_syntax.py --skills-dir hub/skills/elastic
          
          # Validate community skills
          python tests/skills/validate_syntax.py --skills-dir hub/skills/community
          
          # Capture results for both
          RESULT=$(python tests/skills/validate_syntax.py --skills-dir hub/skills/elastic 2>&1)
          ELASTIC_TOTAL=$(echo "$RESULT" | grep "Total:" | grep -oP 'Total: \K\d+' || echo "0")
          ELASTIC_VALID=$(echo "$RESULT" | grep "Valid:" | grep -oP 'Valid: \K\d+' || echo "0")
          
          RESULT=$(python tests/skills/validate_syntax.py --skills-dir hub/skills/community 2>&1)
          COMMUNITY_TOTAL=$(echo "$RESULT" | grep "Total:" | grep -oP 'Total: \K\d+' || echo "0")
          COMMUNITY_VALID=$(echo "$RESULT" | grep "Valid:" | grep -oP 'Valid: \K\d+' || echo "0")
          
          TOTAL=$((ELASTIC_TOTAL + COMMUNITY_TOTAL))
          VALID=$((ELASTIC_VALID + COMMUNITY_VALID))
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "valid=$VALID" >> $GITHUB_OUTPUT
          
          # Fail if any invalid
          if [ "$TOTAL" != "$VALID" ]; then
            echo "::error::Some skills failed validation ($VALID/$TOTAL)"
            exit 1
          fi
          
          echo "✅ All $TOTAL skills validated successfully"
      
      - name: Generate validated manifest
        run: python tests/skills/generate_validated_manifest.py
      
      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: validated-skills-manifest
          path: moltler-hub/src/data/validated_skills.json

  # STEP 2: Build plugin for multiple ES versions
  build:
    name: Build Plugin (ES ${{ matrix.es_version }})
    needs: validate-skills
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - es_version: "9.0.0"
            es_branch: "main"
            java_version: "21"
          - es_version: "8.17.0"
            es_branch: "8.17"
            java_version: "21"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Checkout ES version ${{ matrix.es_branch }}
        working-directory: elasticsearch
        run: |
          git fetch --all --tags
          
          # Try to checkout the branch or tag
          if git show-ref --verify --quiet "refs/heads/${{ matrix.es_branch }}"; then
            git checkout ${{ matrix.es_branch }}
          elif git show-ref --verify --quiet "refs/tags/v${{ matrix.es_version }}"; then
            git checkout v${{ matrix.es_version }}
          elif git show-ref --verify --quiet "refs/remotes/origin/${{ matrix.es_branch }}"; then
            git checkout -b ${{ matrix.es_branch }} origin/${{ matrix.es_branch }}
          else
            echo "Warning: Could not find branch ${{ matrix.es_branch }}, using current HEAD"
          fi
          
          echo "ES version: $(git describe --tags --always)"
      
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      
      - name: Setup plugin in ES tree
        run: |
          # Remove existing plugin directory
          rm -rf elasticsearch/x-pack/plugin/elastic-script
          
          # Copy the plugin source into the ES tree
          cp -r elastic-script elasticsearch/x-pack/plugin/elastic-script
          
          echo "=== Plugin directory setup complete ==="
      
      - name: Build Plugin
        working-directory: elasticsearch
        run: |
          echo "=== Building for ES ${{ matrix.es_version }} ==="
          ./gradlew :x-pack:plugin:elastic-script:bundlePlugin -x test --no-daemon 2>&1 | tail -100
      
      - name: Prepare artifacts
        id: artifacts
        run: |
          mkdir -p dist
          
          # Find the zip file
          ZIP_FILE=$(find elasticsearch/x-pack/plugin/elastic-script/build/distributions -name "*.zip" 2>/dev/null | head -1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found: $ZIP_FILE"
            ORIGINAL_NAME=$(basename "$ZIP_FILE" .zip)
            
            # Rename to include ES version clearly
            NEW_NAME="moltler-plugin-es${{ matrix.es_version }}.zip"
            cp "$ZIP_FILE" "dist/$NEW_NAME"
            
            echo "artifact_name=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "Artifact ready: dist/$NEW_NAME"
          else
            echo "ERROR: No zip file found!"
            ls -la elasticsearch/x-pack/plugin/elastic-script/build/distributions/ 2>/dev/null || echo "No distributions dir"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moltler-plugin-es${{ matrix.es_version }}
          path: dist/*.zip
          if-no-files-found: error

  # STEP 3: Create release with all artifacts
  release:
    name: Create Release
    needs: [validate-skills, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download ES 9.x plugin
        uses: actions/download-artifact@v4
        with:
          name: moltler-plugin-es9.0.0
          path: dist
      
      - name: Download ES 8.x plugin
        uses: actions/download-artifact@v4
        with:
          name: moltler-plugin-es8.17.0
          path: dist
      
      - name: Download validation manifest
        uses: actions/download-artifact@v4
        with:
          name: validated-skills-manifest
          path: manifest
      
      - name: List artifacts
        run: |
          echo "=== Release artifacts ==="
          ls -la dist/
          ls -la manifest/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.zip
            manifest/validated_skills.json
          generate_release_notes: true
          body: |
            ## Moltler Plugin Release ${{ github.ref_name }}
            
            [![Skills Validated](https://img.shields.io/badge/skills-${{ needs.validate-skills.outputs.valid }}%2F${{ needs.validate-skills.outputs.total }}%20validated-brightgreen)](https://github.com/bahaaldine/moltler/actions)
            
            ### Downloads
            
            | Elasticsearch Version | Download |
            |----------------------|----------|
            | **9.0.0** (9.x) | [moltler-plugin-es9.0.0.zip](https://github.com/bahaaldine/moltler/releases/download/${{ github.ref_name }}/moltler-plugin-es9.0.0.zip) |
            | **8.17.0** (8.x) | [moltler-plugin-es8.17.0.zip](https://github.com/bahaaldine/moltler/releases/download/${{ github.ref_name }}/moltler-plugin-es8.17.0.zip) |
            
            ### Installation
            
            ```bash
            # For ES 9.x
            elasticsearch-plugin install file:///path/to/moltler-plugin-es9.0.0.zip
            
            # For ES 8.x
            elasticsearch-plugin install file:///path/to/moltler-plugin-es8.17.0.zip
            
            # Restart Elasticsearch
            systemctl restart elasticsearch
            ```
            
            ### Install Skills
            
            After installing the plugin:
            
            ```bash
            curl -sSL https://hub.moltler.dev/install.sh | bash -s -- --es-url http://localhost:9200
            ```
            
            Or manually:
            
            ```bash
            git clone https://github.com/bahaaldine/moltler.git
            cd moltler
            ./moltler-cli.sh install --all
            ```
            
            ### Version Compatibility
            
            - **ES 9.0.0 plugin**: Compatible with Elasticsearch 9.0.x
            - **ES 8.17.0 plugin**: Compatible with Elasticsearch 8.15.x - 8.17.x
            
            For other versions, build from source:
            
            ```bash
            git clone --recurse-submodules https://github.com/bahaaldine/moltler.git
            cd moltler/elasticsearch
            git checkout v8.15.0  # Your target version
            ./gradlew :x-pack:plugin:elastic-script:bundlePlugin -x test
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
