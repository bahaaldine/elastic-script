name: Skill Tests

on:
  push:
    branches: [main]
    paths:
      - 'hub/skills/**'
      - 'tests/skills/**'
      - '.github/workflows/skill-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hub/skills/**'
      - 'tests/skills/**'
  workflow_dispatch:
    inputs:
      category:
        description: 'Skill category to test (leave empty for all)'
        required: false
        default: ''
      es_version:
        description: 'Elasticsearch version to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '8.17.0'
          - '9.0.0'

jobs:
  # Syntax validation - no ES required
  syntax-validation:
    name: Validate Skill Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Validate all skills (elastic)
        run: python tests/skills/validate_syntax.py --skills-dir hub/skills/elastic
      
      - name: Validate all skills (community)
        run: python tests/skills/validate_syntax.py --skills-dir hub/skills/community
      
      - name: Generate validated manifest
        run: python tests/skills/generate_validated_manifest.py

  # Full tests with Elasticsearch - matrix for 8.x and 9.x
  test-skills:
    name: Test Skills (ES ${{ matrix.es_version }})
    runs-on: ubuntu-latest
    needs: syntax-validation
    
    strategy:
      fail-fast: false
      matrix:
        es_version:
          - '8.17.0'   # Latest 8.x
          - '9.0.0'    # Latest 9.x
    
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.es_version }}
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd="curl -s http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r tests/skills/requirements.txt
      
      - name: Wait for Elasticsearch
        run: |
          echo "Waiting for Elasticsearch ${{ matrix.es_version }}..."
          for i in {1..30}; do
            if curl -s http://localhost:9200/_cluster/health | grep -q '"status"'; then
              echo "Elasticsearch is ready"
              curl -s http://localhost:9200 | jq '.version.number'
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
      
      - name: Build and install plugin
        run: |
          # Build the plugin for the target ES version
          cd elasticsearch
          ./gradlew :x-pack:plugin:elastic-script:assemble -Dbuild.snapshot=false || true
          
          # Note: In CI, we may need to install the plugin into the Docker container
          # For now, we run syntax validation which doesn't require the plugin
          echo "Plugin build completed (full integration tests require plugin installation)"
      
      - name: Run skill tests
        id: test
        run: |
          cd tests/skills
          
          # Set test parameters
          CATEGORY="${{ github.event.inputs.category }}"
          ARGS="--skip-fixtures"
          
          if [ -n "$CATEGORY" ]; then
            ARGS="$ARGS --category $CATEGORY"
          fi
          
          # Run tests (will skip execution tests if plugin not installed)
          python run_skill_tests.py $ARGS || true
          
          # Check results
          if [ -f results/test_results.json ]; then
            echo "Tests completed for ES ${{ matrix.es_version }}"
            cat results/test_results.json | jq '.summary'
          fi
        env:
          ES_URL: http://localhost:9200
          ES_USERNAME: ""
          ES_PASSWORD: ""
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-test-results-es${{ matrix.es_version }}
          path: |
            tests/skills/results/test_results.json
            tests/skills/results/test_results.md
            tests/skills/results/test_results.xml
          retention-days: 30
      
      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'tests/skills/results/test_results.xml'
          fail_on_failure: false
          require_tests: false
          check_name: "Skill Tests (ES ${{ matrix.es_version }})"

  # Update badges and manifest on main branch
  update-artifacts:
    name: Update Artifacts
    runs-on: ubuntu-latest
    needs: [syntax-validation, test-skills]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Generate validated manifest
        run: |
          python tests/skills/generate_validated_manifest.py
          
          # Copy to hub for static hosting
          cp moltler-hub/src/data/validated_skills.json docs/badges/ || true
      
      - name: Create badge
        run: |
          mkdir -p docs/badges
          
          TOTAL=$(python -c "import json; d=json.load(open('moltler-hub/src/data/validated_skills.json')); print(d['total_skills'])")
          VALID=$(python -c "import json; d=json.load(open('moltler-hub/src/data/validated_skills.json')); print(d['valid_skills'])")
          
          cat > docs/badges/skills.json << EOF
          {
            "schemaVersion": 1,
            "label": "skills validated",
            "message": "$VALID/$TOTAL",
            "color": "brightgreen"
          }
          EOF
          
          echo "Badge created: $VALID/$TOTAL skills validated"
